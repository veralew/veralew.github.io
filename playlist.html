<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Playlist</title>
  <style>
    body {
      background-color: #e0f7fa;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .playlist-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    audio {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="playlist-container">
    <h1>Your Music Playlist</h1>
    <audio controls>
      <source src="assets/music/song1.mp3" type="audio/mp3">
      Your browser does not support the audio element.
    </audio>
    <ul>
      <li><a href="#" onclick="document.querySelector('audio').src = 'assets/music/contedela.mp3'">Conte de la Vielle Grand-mere, op 31 no 2</a></li>
    </ul>
  </div>
</body>
</html>
